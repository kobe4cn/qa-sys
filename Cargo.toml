[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Your Name <YourName@yourdomain.com>"]
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/"
repository = "https://github.com/TODO"
homepage = "https://github.com/TODO"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["full"] }
tonic = "0.14.4"
prost = "0.14.4"
tonic-reflection = "0.14.4"
tonic-build = "0.14.4"
tonic-prost = "0.14.4"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "tls-rustls",
    "uuid",
] }
redis = { version = "1.4.1", features = [
    "r2d2",
    "tokio-comp",
    "cluster",
    "cluster-async",
    "json",
] }
r2d2 = { version = "0.8.10" }

# workspace crates
qa-sys-core = { path = "crates/core" }
once_cell = { version = "1.21.4" }
pulsar = "6.8.0"
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

serde_yaml = { version = "0.9.29" }

rust-crypto = "0.2.36"
base64 = "0.23.0"

autometrics = { version = "3.0.0", features = [
    "prometheus-exporter",
    "tracing",
    "tracing-subscriber",
] }
axum = "0.8.9"
async-trait = "0.1.91"
uuid = "1.24.0"
md5 = "0.8.1"
futures = "0.3.33"
pb = { path = "crates/pb" }

validator = { version = "0.21.0", features = ["derive"] }
http-body-util = "0.1.4"
